[package]
name = "glim-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "glim"
path = "src/main.rs"

[[bench]]
name = "markdown_edit"
path = "benches/markdown_edit.rs"
harness = false

[[bench]]
name = "minimap_edit"
path = "benches/minimap_edit.rs"
harness = false

[features]
default = ["git"]
git = ["glim-services/git"]
macos-updater = []
reader-measurements = ["gpui-kit/profiler"]

[dependencies]
tempfile = "3"
log = "0.4"
futures-channel = "0.3"
glim-core.workspace = true
glim-services.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
url = "2"
serde_json = "1"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
raw-window-handle = "0.6"
wry = { version = "=0.57.0", default-features = false, features = ["os-webview"] }
tao = { version = "=0.34.5", default-features = false, features = ["rwh_06"] }

[target.'cfg(windows)'.dependencies]
mime_guess = "2"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Data_Pdf", "Storage_Streams", "Win32_System_Com_StructuredStorage", "Win32_System_Registry", "Win32_System_WinRT", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

# Unsafe is confined to the main-thread native view, context-menu, path-hint and updater bridges.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
