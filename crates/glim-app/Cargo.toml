[package]
name = "glim-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "glim"
path = "src/main.rs"

[features]
macos-updater = []

[dependencies]
log = "0.4"
glim-core.workspace = true
glim-services.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
url = "2"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
wry = { version = "=0.57.0", default-features = false, features = ["os-webview"] }
tao = { version = "=0.34.5", default-features = false, features = ["rwh_06"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"

# Unsafe is confined to the main-thread native view, context-menu, path-hint and updater bridges.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
