[package]
name = "glim-services"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bench]]
name = "raster_memory"
path = "benches/raster_memory.rs"
harness = false

[dependencies]
chrono = "=0.4.45"
log = { version = "0.4", features = ["std"] }
glim-core.workspace = true
anyhow.workspace = true
ignore = "0.4"
notify = "8.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "exr", "hdr", "qoi"] }
gif = "=0.14.2"
png = "=0.17.16"
matroska-demuxer = "=0.8.1"
mp4 = "=0.14.0"
url = "2"
resvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }

tempfile = "3"
tiff = "=0.11.3"
serde_json = "1"
serde_yaml_ng = "=0.10.0"
sha2 = "0.10"
markdown = "=1.0.0"
csv = "1"
sys-locale = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
crc32fast = "=1.5.2"
bzip2 = "0.6"
xz2 = "0.1"
zstd = { version = "0.13", default-features = false }
lz4_flex = "0.11"
quick-xml = "0.38"
object = { version = "=0.37.3", default-features = false, features = ["read", "std"] }
html5ever = "=0.27.0"
markup5ever_rcdom = "=0.3.0"
json5 = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
roxmltree = "0.21"
encoding_rs = "0.8"
rusqlite = { version = "=0.37.0", default-features = false, features = ["hooks"] }

[lints]
workspace = true
