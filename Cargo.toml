[workspace]
members = ["crates/glim-core", "crates/glim-services", "crates/glim-app"]
default-members = ["crates/glim-app"]
resolver = "3"

[workspace.package]
version = "0.2.12"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/glimapp/glim"

[workspace.dependencies]
glim-core = { path = "crates/glim-core" }
glim-services = { path = "crates/glim-services" }
gpui-kit = { version = "=0.7.1", features = [
    "tree-sitter-rust", "tree-sitter-javascript", "tree-sitter-typescript",
    "tree-sitter-tsx", "tree-sitter-toml", "tree-sitter-python", "tree-sitter-go",
    "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-css", "tree-sitter-html",
    "tree-sitter-yaml", "tree-sitter-bash", "tree-sitter-swift",
    "tree-sitter-markdown", "tree-sitter-markdown-inline",
    "tree-sitter-java", "tree-sitter-sql", "tree-sitter-make",
    "tree-sitter-ruby", "tree-sitter-php", "tree-sitter-csharp", "tree-sitter-kotlin",
    "tree-sitter-lua", "tree-sitter-scala", "tree-sitter-elixir", "tree-sitter-zig",
    "tree-sitter-graphql", "tree-sitter-proto", "tree-sitter-cmake",
    "tree-sitter-astro", "tree-sitter-svelte", "tree-sitter-erb", "tree-sitter-ejs",
    "tree-sitter-jsdoc",
] }
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
debug = "limited"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Keep GPUI pinned; local patches add frame recovery, visible-only measurement and opt-in task checkbox callbacks.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-base = { path = "vendor/gpui-base" }
