name: Architecture contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  architecture:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check architecture and locale contracts
        run: |
          python3 scripts/check-architecture.py
          python3 scripts/check-locales.py
      - name: Verify the native preview request and resource contracts
        run: |
          cargo test --locked -p glim-services --lib preview::request::tests::rust_encoding_matches_the_swift_contract_fixtures -- --exact
          scripts/test-native-preview.sh --contracts-only
      - name: Verify Markdown preview and export semantics
        run: cargo test --locked -p glim-services --lib markdown_export::tests
      - name: Verify archive and image refresh contracts
        run: |
          cargo test --locked -p glim-services --lib archive::tests::directory_listing_preserves_sizes_visibility_and_order -- --exact
          cargo test --locked -p glim-services --lib documents::refresh::tests
      - name: Verify cache compatibility and reader memory ownership
        run: |
          cargo test --locked -p glim-services --lib storage::cache::tests
          cargo test --locked -p glim-services --lib markdown_preview::disk_cache::tests
          cargo test --locked -p glim-services --lib resources::tests
          cargo test --locked -p glim-services --lib media::raster::tests
      - name: Verify structured graph projection contracts
        run: cargo test --locked -p glim-services --lib graph::projection::tests
      - name: Verify ebook preparation contracts
        run: cargo test --locked -p glim-services --lib books::tests
      - name: Verify JSON formatting preserves source tokens
        run: cargo test --locked -p glim-services --test reader_session_regressions formatting_preserves_duplicate_keys_and_numeric_spelling -- --exact
      - name: Verify UTF-8 reading across input buffers
        run: cargo test --locked -p glim-services --lib files::tests::full_text_read_preserves_a_utf8_character_across_input_buffers -- --exact
  reader-lifecycle:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: reader-lifecycle
          cache-bin: false
      - name: Verify tab and preview lifecycle contracts
        shell: bash
        run: |
          run_contracts() {
            cargo test --locked -p glim-app --bin glim "$@" | tee "$RUNNER_TEMP/glim-lifecycle-tests.log"
            if grep -Fq 'running 0 tests' "$RUNNER_TEMP/glim-lifecycle-tests.log"; then
              echo "::error::No tests matched $1"
              return 1
            fi
          }
          run_contracts views::workspace::tabs::tests
          run_contracts views::reader::media::tests
          run_contracts views::reader::editing::editing_tests::paged_html_retains_source_editor_and_blocks_preview_for_unsaved_edits -- --exact
          run_contracts views::reader::paged::tests::cancelled_restoration_preserves_generated_source_and_position -- --exact
