name: macOS builds
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'crates/**'
      - 'native/**'
      - 'vendor/**'
      - 'assets/macos/**'
      - 'assets/branding/**'
      - 'assets/locales/**'
      - 'assets/reader-limits.json'
      - 'assets/markdown/**'
      - 'assets/file-icons/**'
      - 'assets/navigation/**'
      - 'assets/highlights/**'
      - '!assets/**/README.md'
      - 'scripts/check-locales.py'
      - 'scripts/generate-reader-limits.py'
      - 'scripts/bundle-macos.sh'
      - 'scripts/bundle-finder.py'
      - 'scripts/package-dmg.sh'
      - 'scripts/configure-updater.py'
      - 'scripts/sign-macos.py'
      - 'scripts/fetch-sparkle.sh'
      - 'scripts/test-updater*'
      - 'scripts/test-macos-signing.py'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  select-build:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.select.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        if: github.ref_type != 'tag'
      - name: Avoid duplicate main and tag builds
        id: select
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            glim_tagged=$(git ls-remote --tags origin 'refs/tags/v*' | awk -v commit="$GITHUB_SHA" '$1 == commit { found=1 } END { print found ? "true" : "false" }')
            if [[ "$glim_tagged" == true ]]; then
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              echo 'This commit has a release tag; the tag workflow owns validation and packaging.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
            fi
          fi
  build:
    needs: select-build
    if: needs.select-build.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
            arch: arm64
            validate: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
            arch: x86_64
            validate: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Use the same optimized profile, target and feature set for all Cargo steps.
      # Parallel codegen without LTO avoids rebuilding a costly link-time program.
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_INCREMENTAL: '0'
      GLIM_ENABLE_UPDATER: '1'
      GLIM_UPDATE_PUBLIC_KEY: ${{ vars.GLIM_UPDATE_PUBLIC_KEY }}
      GLIM_SPARKLE_DIR: ${{ github.workspace }}/target/sparkle/2.10.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: ${{ matrix.validate && 'rustfmt, clippy' || '' }}
          targets: ${{ matrix.target }}
      - name: Restore architecture-specific release cache
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}-macos-updater
          env-vars: 'CARGO CC CFLAGS CXX CMAKE RUST GLIM_UPDATE_PUBLIC_KEY'
          cache-workspace-crates: true
          cache-on-failure: true
          cache-bin: false
      - name: Restore pinned Sparkle archive
        uses: actions/cache@v4
        with:
          path: target/sparkle/2.10.0/Sparkle.tar.xz
          key: sparkle-${{ hashFiles('scripts/fetch-sparkle.sh') }}
      - name: Verify and extract Sparkle SDK
        run: scripts/fetch-sparkle.sh
      - name: Check formatting once
        if: matrix.validate
        run: cargo fmt --all --check
      - name: Check release code once
        if: matrix.validate
        run: cargo clippy --workspace --all-targets --release --target ${{ matrix.target }} --features macos-updater --locked -- -D warnings
      - name: Test release code once
        if: matrix.validate
        env:
          # Release binaries keep bundle-relative rpaths; test binaries use this SDK.
          DYLD_FRAMEWORK_PATH: ${{ env.GLIM_SPARKLE_DIR }}
        run: cargo test --workspace --release --target ${{ matrix.target }} --features macos-updater --locked
      - name: Validate native updater once
        if: matrix.validate
        run: scripts/test-updater.sh
      - name: Build optimized release executable
        run: |
          glim_stage_started=$(date +%s)
          trap 'glim_stage_status=$?; printf "\n**Release executable**: %s seconds (exit %s)\n" "$(( $(date +%s) - glim_stage_started ))" "$glim_stage_status" >> "$GITHUB_STEP_SUMMARY"; exit "$glim_stage_status"' EXIT
          cargo build --release --target ${{ matrix.target }} --features macos-updater --locked
      - name: Package version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          glim_stage_started=$(date +%s)
          trap 'glim_stage_status=$?; printf "\n**DMG packaging**: %s seconds (exit %s)\n" "$(( $(date +%s) - glim_stage_started ))" "$glim_stage_status" >> "$GITHUB_STEP_SUMMARY"; exit "$glim_stage_status"' EXIT
          scripts/package-dmg.sh ${{ matrix.arch }}
      - name: Record cache and disk usage
        if: always()
        env:
          RELEASE_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          {
            echo "### ${{ matrix.platform }} release build"
            echo "Exact Rust cache hit: $RELEASE_CACHE_HIT"
            echo '```text'
            du -sh target "$CARGO_HOME/registry" dist 2>/dev/null || true
            df -h .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Glim-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
