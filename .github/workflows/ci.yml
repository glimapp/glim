name: macOS builds
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      intel-cross-compile:
        description: 'Experiment: build only the Intel package on Apple Silicon and verify it on Intel'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.intel-cross-compile &&
          '[{"os":"macos-15","target":"x86_64-apple-darwin","platform":"macos-x86_64-cross","arch":"x86_64"}]' ||
          '[{"os":"macos-15","target":"aarch64-apple-darwin","platform":"macos-arm64","arch":"arm64"},
          {"os":"macos-15-intel","target":"x86_64-apple-darwin","platform":"macos-x86_64","arch":"x86_64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Use the same optimized profile, target and feature set for all Cargo steps.
      # Parallel codegen without LTO avoids rebuilding a costly link-time program.
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_INCREMENTAL: '0'
      GLIM_ENABLE_UPDATER: '1'
      GLIM_DISTRIBUTION: ${{ github.repository == 'glimapp/glim' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'github-release' || 'development' }}
      GLIM_UPDATE_PUBLIC_KEY: ${{ vars.GLIM_UPDATE_PUBLIC_KEY }}
      GLIM_SPARKLE_DIR: ${{ github.workspace }}/target/sparkle/2.10.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
      - name: Restore architecture-specific release cache
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}-macos-updater
          env-vars: 'CARGO CC CFLAGS CXX CMAKE RUST GLIM_UPDATE_PUBLIC_KEY'
          cache-workspace-crates: true
          cache-on-failure: true
          cache-bin: false
      - name: Restore pinned Sparkle archive
        uses: actions/cache@v4
        with:
          path: target/sparkle/2.10.0/Sparkle.tar.xz
          key: sparkle-${{ hashFiles('scripts/fetch-sparkle.sh') }}
      - name: Verify and extract Sparkle SDK
        run: scripts/fetch-sparkle.sh
      - name: Build optimized release executable
        run: |
          glim_stage_started=$(date +%s)
          trap 'glim_stage_status=$?; printf "\n**Release executable**: %s seconds (exit %s)\n" "$(( $(date +%s) - glim_stage_started ))" "$glim_stage_status" >> "$GITHUB_STEP_SUMMARY"; exit "$glim_stage_status"' EXIT
          cargo build --release --target ${{ matrix.target }} --features macos-updater --locked
      - name: Verify telemetry distribution
        if: ${{ !inputs.intel-cross-compile }}
        env:
          DYLD_FRAMEWORK_PATH: ${{ env.GLIM_SPARKLE_DIR }}
        run: |
          target/${{ matrix.target }}/release/glim --build-info | python3 -c '
          import json, os, sys
          info = json.load(sys.stdin)
          expected = "release" if os.environ["GLIM_DISTRIBUTION"] == "github-release" else "debug"
          assert info["telemetry_environment"] == expected, info
          assert info["is_debug"] == (expected == "debug"), info
          print("Verified telemetry environment:", expected)
          '
      - name: Package version tag
        if: startsWith(github.ref, 'refs/tags/v') || inputs.intel-cross-compile
        run: |
          glim_stage_started=$(date +%s)
          trap 'glim_stage_status=$?; printf "\n**DMG packaging**: %s seconds (exit %s)\n" "$(( $(date +%s) - glim_stage_started ))" "$glim_stage_status" >> "$GITHUB_STEP_SUMMARY"; exit "$glim_stage_status"' EXIT
          scripts/package-dmg.sh ${{ matrix.arch }}
      - name: Record cache and disk usage
        if: always()
        env:
          RELEASE_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          {
            echo "### ${{ matrix.platform }} release build"
            echo "Exact Rust cache hit: $RELEASE_CACHE_HIT"
            echo '```text'
            du -sh target "$CARGO_HOME/registry" dist 2>/dev/null || true
            df -h .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') || inputs.intel-cross-compile
        with:
          name: Glim-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  verify-intel-cross-compile:
    if: inputs.intel-cross-compile
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Glim-macos-x86_64-cross
          path: dist
      - name: Verify the cross-compiled package on Intel
        run: |
          [[ "$(uname -m)" == x86_64 ]]
          cd dist
          shasum -a 256 -c ./*.sha256
          glim_mount="$RUNNER_TEMP/glim-intel-cross"
          mkdir -p "$glim_mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$glim_mount" ./*.dmg
          trap 'hdiutil detach "$glim_mount"' EXIT
          glim_bundle="$glim_mount/Glim.app"
          [[ "$(lipo -archs "$glim_bundle/Contents/MacOS/glim")" == x86_64 ]]
          codesign --verify --deep --strict "$glim_bundle"
          plutil -lint "$glim_bundle/Contents/Info.plist"
          "$glim_bundle/Contents/MacOS/glim" --build-info | python3 -c '
          import json, sys
          info = json.load(sys.stdin)
          assert info["telemetry_environment"] == "debug", info
          assert info["is_debug"], info
          print(json.dumps(info, indent=2))
          '
          echo 'Intel package architecture, checksum, signature and --build-info passed on an Intel runner.' >> "$GITHUB_STEP_SUMMARY"
