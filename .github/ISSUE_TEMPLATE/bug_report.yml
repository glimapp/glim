name: Bug report / 问题反馈
description: Tell us which task failed while opening, reading or editing a file. / 描述查看或编辑文件时遇到的问题。
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "English / 中文均可。Current supported targets: macOS Apple Silicon and Intel. Other platforms are not maintained. Please remove private paths, credentials, and document content from attachments."
  - type: input
    id: version
    attributes:
      label: Glim version / 版本
      placeholder: "Copy from About Glim / 从关于 Glim 复制"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Other / historical release (not maintained)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version / 系统版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and actual behavior / 复现步骤与实际表现
      description: Describe the task first, then the steps, file type and approximate size. / 先说明正在做什么，再写步骤、文件类型及大致大小。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 期望表现
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized sample, screenshot, or logs / 脱敏样例、截图或日志
      description: Use a public or synthetic sample; inspect logs before sharing. Include assistive technology if relevant. / 提供可公开或合成样例，分享前检查日志；辅助功能问题请说明所用技术。
